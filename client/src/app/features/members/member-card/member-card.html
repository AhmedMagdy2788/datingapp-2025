<div
  [routerLink]="`/members/${this.member().id}`"
  class="card cursor-pointer shadow-lg side bg-base-100 hover:shadow-2xl hover:-translate-y-1.5 transform transition-all duration-300 ease-in-out"
>
  <div class="card-body w-full p-0 m-0">
    <img
      [src]="member().imageUrl ?? '/user.png'"
      [alt]="member().userName + 'avatar'"
      class="bg-cover rounded-xl"
    />
    <div
      class="flex flex-col text-white z-50 absolute bottom-0 w-full px-3 py-1 rounded-b-lg bg-gradient-to-t from-black via-black/75 to-black/0"
    >
      <h2 class="card-title">{{ member().userName }}</h2>
      <p>Age: {{ memberAge() }}</p>
    </div>
  </div>
</div>
